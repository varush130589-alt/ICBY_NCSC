<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IBCY - Innovative Bot for Creative Youth</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="app">

        <header>

            <div>
                <h1>IBCY</h1>

                <p>
                    Innovative Bot for Creative Youth
                </p>
            </div>

            <div class="status">
                ● Online
            </div>

        </header>


        <main id="chat">

            <div class="message bot">

                <div class="sender">
                    IBCY
                </div>

                <div class="bubble">

                    Hello! I'm IBCY.
                    <br><br>
                    Ask me something and let's
                    explore it together.

                </div>

            </div>

        </main>


        <div
            id="loading"
            class="loading hidden"
        >
            IBCY is thinking...
        </div>


        <footer>

            <textarea
                id="messageInput"
                placeholder="Ask IBCY something..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
            >
                Send
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
